<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تنظیمات FarsiFix</title>
<style>
  :root{color-scheme:light dark;--bg:#f6f7fa;--fg:#1b2130;--muted:#667085;--card:#fff;--line:#dfe3ea;--accent:#3d7bf5}
  @media (prefers-color-scheme:dark){:root{--bg:#141922;--fg:#eef1f6;--muted:#98a2b3;--card:#1d2330;--line:#2e3646}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.8 Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif}
  main{max-width:520px;margin:48px auto;padding:0 20px}
  h1{font-size:22px;margin:0 0 4px}
  p.sub{margin:0 0 24px;color:var(--muted)}
  section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
  h2{font-size:15px;margin:0 0 12px}
  .langs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
  label span{display:block;font-size:13px;color:var(--muted)}
  select,button{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
  button{cursor:pointer;width:auto}
  button:hover{border-color:var(--accent)}
  select:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .row{display:flex;gap:10px;align-items:flex-start}
  .row input{margin-top:8px;width:18px;height:18px}
  .hint{color:var(--muted);font-size:13px;margin:4px 0 0}
  #saved{color:#12b76a;font-size:13px;height:20px;opacity:0;transition:opacity .2s}
  #saved.on{opacity:1}
  kbd{border:1px solid var(--line);border-radius:5px;padding:1px 7px;font-size:13px}
</style>
</head>
<body>
<main>
  <h1>تنظیمات FarsiFix</h1>
  <p class="sub">تغییرات خودکار ذخیره می‌شن. <span id="saved">ذخیره شد ✓</span></p>

  <section>
    <h2>زبان ترجمه</h2>
    <div class="langs">
      <label><span>زبان مبدا</span><select id="source"></select></label>
      <button id="swap" type="button" title="جابه‌جایی" aria-label="جابه‌جایی زبان‌ها">⇄</button>
      <label><span>زبان مقصد</span><select id="target"></select></label>
    </div>
    <p class="hint">اگر متن انتخاب‌شده فارسی باشه و مقصد «فارسی»، ترجمه خودکار برعکس انجام می‌شه.</p>
  </section>

  <section>
    <h2>تبدیل خودکار کیبورد</h2>
    <label class="row">
      <input type="checkbox" id="autoDetect">
      <div>پیشنهاد تبدیل وقتی متن انگلیسیِ نامفهوم تایپ می‌شه
        <p class="hint">مثلاً <b dir="ltr">sghl lk uxh isjl</b> ← «سلام من عطا هستم»</p></div>
    </label>
  </section>

  <section>
    <h2>میانبر ترجمه</h2>
    <p style="margin:0 0 10px">متن رو انتخاب کن و بزن <span id="keys" dir="ltr"></span></p>
    <p class="hint" style="margin:0 0 10px">یا روی متن انتخاب‌شده راست‌کلیک کن و «ترجمه با FarsiFix» رو بزن.</p>
    <button id="shortcuts" type="button">تغییر میانبر</button>
  </section>
</main>
<script src="options.js"></script>
</body>
</html>
